[project]
name="paperflow"
version="0.3.0"
description="Local-first literature, analysis and reference manager"
readme="README.md"
requires-python=">=3.11"
dependencies=["PySide6>=6.7","PyMuPDF>=1.24","requests>=2.32","citeproc-py>=0.8","citeproc-py-styles>=0.1.5"]

[project.scripts]
paperflow="paperflow.app:run"

[dependency-groups]
dev=["pytest>=8","ruff>=0.6"]

[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[tool.hatch.build.targets.wheel]
packages=["src/paperflow"]

[tool.pytest.ini_options]
pythonpath=["src"]
